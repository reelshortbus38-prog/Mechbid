<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Coldgauge — The Estimator for Refrigeration AND HVAC Contractors</title>
    <meta name="description" content="The only estimating tool built for mechanical contractors who do both trades. AI reads your plans, schedules, and scope docs — grocery refrigeration remodels to commercial HVAC — and builds the takeoff, materials, labor, and proposal." />
    <meta property="og:title" content="Coldgauge — The Estimator for Refrigeration AND HVAC Contractors" />
    <meta property="og:description" content="One tool, both trades. AI reads your plans and schedules and builds the bid — refrigeration circuits and rack work, VAV schedules and ductwork." />
    <meta property="og:type" content="website" />
    <!-- The app had no icon at all: a 404 on every page load, a blank browser
         tab, and — on the iPad this is actually used on — a grey screenshot
         thumbnail instead of an app icon when somebody adds it to their home
         screen. The touch icon and the web-app meta below are what make that
         launch full-screen and look like a tool rather than a bookmark. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#080d08" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Coldgauge" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { min-height: 100vh; background: #080d08; }
      body { -webkit-font-smoothing: antialiased; }
      input[type=number]::-webkit-inner-spin-button,
      input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
      input[type=number] { -moz-appearance: textfield; }
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #1a2e1a; border-radius: 2px; }
      select option { background: #111911; color: #edfaed; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
