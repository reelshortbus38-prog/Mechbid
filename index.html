    <title>MechBid — The Estimator for Refrigeration AND HVAC Contractors</title>
    <meta name="description" content="The only estimating tool built for mechanical contractors who do both trades. AI reads your plans, schedules, and scope docs — grocery refrigeration remodels to commercial HVAC — and builds the takeoff, materials, labor, and proposal." />
    <meta property="og:title" content="MechBid — The Estimator for Refrigeration AND HVAC Contractors" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { min-height: 100vh; background: #080d08; }
      body { -webkit-font-smoothing: antialiased; }
      input[type=number]::-webkit-inner-spin-button,
      input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
      input[type=number] { -moz-appearance: textfield; }
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #1a2e1a; border-radius: 2px; }
      select option { background: #111911; color: #edfaed; }
