# ── REGENERATE package-lock.json WITHOUT A DEV MACHINE ──────────────────────
# Run it from the Actions tab: lockfile → Run workflow → pick the branch.
#
# WHEN YOU NEED THIS: any time package.json changes — a dependency added,
# removed, or bumped. `npm ci` in the verify workflow installs exactly what the
# lockfile pins and fails if the two disagree, so a package.json edit without a
# matching lockfile turns CI red until this is run.
#
# WHY IT IS A WORKFLOW AND NOT "just run npm install": `xlsx` comes from the
# SheetJS CDN rather than the npm registry, because the registry copy stopped
# at 0.18.5 and carries known advisories. Any machine that cannot reach
# cdn.sheetjs.com cannot resolve this project — which includes the sandbox
# these changes are usually written in. A GitHub runner can. So the one machine
# that can always do it is this one, and it needs no laptop.
#
# It commits to the branch you pick and never to main, so the change still goes
# through a pull request like anything else. If the lockfile is already correct
# it says so and commits nothing.
name: lockfile

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to update the lockfile on (never main)'
        required: true
        default: 'claude/mechbid-repo-ewzwpu'

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Refuse main outright. This job pushes, and a workflow that can write to
      # the default branch is worth not having at all.
      - name: Refuse to write to main
        run: |
          case "${{ inputs.branch }}" in
            main|master)
              echo "::error::Pick a working branch. The lockfile change goes through a pull request like anything else."
              exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # --package-lock-only resolves the whole tree and writes the lockfile
      # without unpacking node_modules. It still fetches the CDN tarball for
      # its metadata and integrity hash, which is the point.
      - run: npm install --package-lock-only

      - name: Commit the lockfile if it changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already in sync — nothing to do."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Regenerate package-lock.json

          Run from the lockfile workflow, on a runner that can reach
          cdn.sheetjs.com — where xlsx comes from, and which not every machine
          working on this repo can.'
          git push
