# ── ONE-OFF: PUT xlsx BACK IN THE LOCKFILE ──────────────────────────────────
# package.json takes xlsx from the SheetJS CDN rather than the npm registry,
# because the registry copy stopped at 0.18.5 and carries known advisories.
# That was the right call. What it left behind is a package-lock.json with no
# xlsx entry at all, so `npm ci` refuses and a clean checkout of this repo
# cannot be installed.
#
# Fixing it needs one `npm install` on a machine that can reach the CDN, and
# the result committed. This is that machine.
#
# Run by hand (Actions → lockfile → Run workflow). It writes to the working
# branch, never to main — the change still goes through a pull request like
# everything else.
name: lockfile

on:
  workflow_dispatch:

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/mechbid-repo-ewzwpu

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # --package-lock-only resolves the tree and writes the lockfile without
      # unpacking node_modules. It still fetches the CDN tarball for its
      # metadata, which is the whole point.
      - run: npm install --package-lock-only

      - name: Commit the lockfile if it changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already in sync — nothing to do."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Lock xlsx at the version production actually installs

          package.json takes xlsx from the SheetJS CDN, and a URL dependency
          left no entry in package-lock.json, so `npm ci` refused: "Missing:
          xlsx@0.20.3 from lock file". A clean checkout could not be installed.

          Generated by the lockfile workflow, on a runner that can reach
          cdn.sheetjs.com.

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>'
          git push
