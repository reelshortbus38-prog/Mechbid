# Runs the whole check on every push and every pull request.
#
# Until now nothing ran automatically. A branch could be merged with a failing
# suite or a broken build and the only thing standing in the way was somebody
# remembering to run it. That is not a control, that is a habit.
#
# `npm run verify` is the same command to run locally: the tests and the
# production build, together. Both matter — a broken .jsx file can pass the
# suite and fail the build, which is how one got through once already.
name: verify

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `npm ci` and not `npm install`: it installs exactly what the lockfile
      # pins and fails rather than quietly resolving something newer.
      #
      # This briefly ran as `npm install`, because it had to — the lockfile had
      # no entry for `xlsx` at all (package.json takes it from the SheetJS CDN,
      # and a URL dependency does not lock itself), so `npm ci` refused with
      # "Missing: xlsx@0.20.3 from lock file". The lockfile workflow has since
      # fixed that, so the strong check is back.
      #
      # This step failing with a "not in sync" message means somebody changed
      # package.json without regenerating the lockfile. That is the check
      # working, not the check being in the way.
      - run: npm ci

      - run: npm run verify
