# Runs the whole check on every push and every pull request.
#
# Until now nothing ran automatically. A branch could be merged with a failing
# suite or a broken build and the only thing standing in the way was somebody
# remembering to run it. That is not a control, that is a habit.
#
# `npm run verify` is the same command to run locally: the tests and the
# production build, together. Both matter — a broken .jsx file can pass the
# suite and fail the build, which is how one got through once already.
name: verify

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `npm install`, not `npm ci`, and deliberately — it is what vercel.json
      # sets as the installCommand, so this installs the same tree production
      # builds from. That matters more than lockfile purity here, because of
      # `xlsx`: package.json takes it from the SheetJS CDN rather than the npm
      # registry (the registry copy stopped at 0.18.5 and carries known
      # advisories), and a URL dependency is not in package-lock.json. `npm ci`
      # refuses outright — "Missing: xlsx@0.20.3 from lock file" — which is
      # exactly how this run first failed.
      #
      # The lockfile being out of sync is a real thing to fix, not something
      # this workflow should paper over quietly. It needs `npm install` run and
      # the result committed from a machine that can reach cdn.sheetjs.com.
      - run: npm install

      - run: npm run verify
