<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Coldgauge">
  <rect width="64" height="64" rx="14" fill="#080d08"/>
  <!-- The gauge: a three-quarter arc with a needle, which is the half of the
       name that is not "cold". Drawn rather than lettered so it stays legible
       at 16px in a browser tab. -->
  <path d="M14 44a22 22 0 1 1 36 0" fill="none" stroke="#1a3a24" stroke-width="6" stroke-linecap="round"/>
  <path d="M14 44a22 22 0 0 1 7-25" fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
  <path d="M32 42 44 24" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>
  <circle cx="32" cy="43" r="4.5" fill="#22c55e"/>
</svg>
